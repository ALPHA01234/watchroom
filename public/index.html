<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d13"><title>WatchRoom</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0d13;color:#f4f5f8;font:15px/1.4 Inter,system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}.top{height:62px;border-bottom:1px solid #252a36;display:flex;align-items:center;padding:0 20px;gap:14px;background:#10131b}.brand{font-size:18px;font-weight:750;letter-spacing:-.03em}.brand span{color:#8a73ff}.room{margin-left:auto;color:#a9afbf;border:1px solid #303646;border-radius:8px;padding:7px 11px;font-size:13px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;min-height:calc(100vh - 62px)}.main{padding:18px;min-width:0}.toolbar{display:flex;gap:8px;margin-bottom:14px}.toolbar input,.composer input,.join input{background:#141822;border:1px solid #303646;border-radius:8px;color:#fff;padding:11px 12px;outline:0;min-width:0}.toolbar input{flex:1}.btn{background:#1a1f2b;border:1px solid #303646;border-radius:8px;color:#fff;padding:10px 13px;font-weight:650;display:inline-flex;align-items:center;gap:7px}.btn:hover{border-color:#6d7590}.btn.primary{background:#735cf4;border-color:#735cf4}.btn.danger{color:#ff8995}.icon{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.screen{background:#050609;border:1px solid #292f3d;border-radius:12px;aspect-ratio:16/9;display:grid;place-items:center;overflow:hidden;position:relative}.screen video{width:100%;height:100%;object-fit:contain;background:#050609}.placeholder{text-align:center;color:#9ba3b5}.placeholder strong{display:block;color:#f6f7fb;font-size:20px;margin-bottom:5px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:12px}.state{margin-left:auto;color:#9ba3b5;font-size:13px}.chat{border-left:1px solid #252a36;background:#10131b;display:grid;grid-template-rows:auto 1fr auto}.chathead{padding:16px;border-bottom:1px solid #252a36;display:flex;align-items:center;gap:9px}.online{width:8px;height:8px;background:#3bd69b;border-radius:50%}.count{margin-left:auto;color:#9ba3b5;font-size:13px}.messages{padding:14px;overflow:auto}.message{margin-bottom:14px}.author{font-weight:700;font-size:13px}.stamp{color:#7f879a;font-size:11px;margin-left:6px}.body{color:#d7dbea;overflow-wrap:anywhere}.composer{padding:12px;border-top:1px solid #252a36;display:flex;gap:8px}.modal{position:fixed;inset:0;display:grid;place-items:center;background:#07080dcc;z-index:3;padding:20px}.card{width:min(430px,100%);background:#141822;border:1px solid #303646;border-radius:14px;padding:24px}.card h1{margin:0 0 7px}.card p{color:#a9afbf;margin:0 0 20px}.join{display:grid;gap:10px}.joinrow{display:flex;gap:8px}.hide{display:none!important}@media(max-width:800px){.layout{display:block}.main{padding:10px}.chat{position:fixed;inset:62px 0 0;z-index:2}.mobile{display:inline-flex}.desktopchat{display:none}.toolbar{display:grid;grid-template-columns:1fr auto}.toolbar input{grid-column:1/-1}.state{width:100%;margin-left:0}}
</style></head><body><header class="top"><div class="brand">Watch<span>Room</span></div><button class="btn mobile" id="chatToggle">Chat</button><div class="room" id="roomLabel">Not connected</div></header><main class="layout"><section class="main"><div class="toolbar"><input id="pageUrl" placeholder="Optional website or media URL"><button class="btn primary" id="load">Load</button><button class="btn" id="invite">Invite</button></div><div class="screen" id="screen"><div class="placeholder"><strong>Private room ready</strong><span>Share your screen or load a browser-playable video.</span></div></div><div class="controls"><button class="btn primary" id="share"><svg class="icon"><use href="#shareIcon"/></svg>Share screen</button><button class="btn" id="stop" disabled><svg class="icon"><use href="#stopIcon"/></svg>Stop sharing</button><button class="btn" id="mic"><svg class="icon"><use href="#micIcon"/></svg>Mic off</button><button class="btn" id="full"><svg class="icon"><use href="#fullIcon"/></svg>Fullscreen</button><button class="btn danger" id="leave"><svg class="icon"><use href="#leaveIcon"/></svg>Leave</button><span class="state" id="state">No screen shared</span></div></section><aside class="chat" id="chat"><div class="chathead"><span class="online"></span><b>Room chat</b><span class="count" id="count">0 online</span></div><div class="messages" id="messages"></div><form class="composer" id="form"><input id="text" maxlength="500" placeholder="Write a message"><button class="btn primary">Send</button></form></aside></main><div class="modal" id="modal"><div class="card"><h1>Join your private room</h1><p>Audio starts muted. Screen sharing begins only after you press Share screen.</p><div class="join"><input id="name" maxlength="24" placeholder="Your name"><div class="joinrow"><input id="room" maxlength="18" placeholder="Room code"><button class="btn primary" id="join">Join room</button></div></div></div></div><svg hidden><symbol id="shareIcon" viewBox="0 0 24 24"><path d="M12 15V3m0 0-4 4m4-4 4 4M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></symbol><symbol id="stopIcon" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></symbol><symbol id="micIcon" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3m-4 0h8"/></symbol><symbol id="fullIcon" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M8 21H3v-5m18 0v5h-5"/></symbol><symbol id="leaveIcon" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3m9-7h6a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-6"/></symbol></svg><script>
(()=>{const $=s=>document.querySelector(s),p=new URLSearchParams(location.search),S={id:crypto.randomUUID(),ws:null,room:'',name:'',stream:null,mic:null,peers:new Map()};const send=x=>S.ws?.readyState===1&&S.ws.send(JSON.stringify({...x,from:S.id}));const add=(n,t)=>{let e=document.createElement('div');e.className='message';e.innerHTML='<div><span class="author"></span><span class="stamp"></span></div><div class="body"></div>';e.querySelector('.author').textContent=n;e.querySelector('.stamp').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});e.querySelector('.body').textContent=t;$('#messages').append(e);$('#messages').scrollTop=1e9};function connect(){let pr=location.protocol==='https:'?'wss:':'ws:';S.ws=new WebSocket(pr+'//'+location.host+'/ws?room='+S.room+'&id='+S.id+'&name='+encodeURIComponent(S.name));S.ws.onopen=()=>{ $('#roomLabel').textContent='Room '+S.room;add('WatchBot','Connected. Press Share screen when ready.')};S.ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='count')$('#count').textContent=m.count+' online';if(m.type==='chat')add(m.name,m.text);if(m.type==='screen-started'){send({type:'screen-viewer-joined',to:m.from})}if(m.type==='screen-viewer-joined'&&S.stream)offer(m.from);if(m.type==='screen-signal')signal(m);if(m.type==='screen-stopped'){document.querySelector('#remote')?.remove();$('#state').textContent='Screen stopped'}}}
async function offer(id){let pc=peer(id);S.stream.getTracks().forEach(t=>pc.addTrack(t,S.stream));let o=await pc.createOffer();await pc.setLocalDescription(o);send({type:'screen-signal',to:id,data:{sdp:pc.localDescription}})}function peer(id){if(S.peers.has(id))return S.peers.get(id);let pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});S.peers.set(id,pc);pc.onicecandidate=e=>e.candidate&&send({type:'screen-signal',to:id,data:{candidate:e.candidate}});pc.ontrack=e=>{let v=$('#remote')||document.createElement('video');v.id='remote';v.autoplay=true;v.playsInline=true;v.srcObject=e.streams[0];$('#screen').replaceChildren(v);$('#state').textContent='Watching shared screen'};return pc}async function signal(m){let pc=peer(m.from);if(m.data.sdp){await pc.setRemoteDescription(m.data.sdp);if(m.data.sdp.type==='offer'){let a=await pc.createAnswer();await pc.setLocalDescription(a);send({type:'screen-signal',to:m.from,data:{sdp:pc.localDescription}})}}if(m.data.candidate)await pc.addIceCandidate(m.data.candidate).catch(()=>{})}
$('#share').onclick=async()=>{try{S.stream=await navigator.mediaDevices.getDisplayMedia({video:{width:{ideal:854,max:1280},height:{ideal:480,max:720},frameRate:{ideal:12,max:15}},audio:true});let v=document.createElement('video');v.autoplay=true;v.muted=true;v.playsInline=true;v.srcObject=S.stream;$('#screen').replaceChildren(v);$('#share').disabled=true;$('#stop').disabled=false;$('#state').textContent='Sharing your screen';send({type:'screen-started'});S.stream.getVideoTracks()[0].onended=stop}catch{add('WatchBot','Screen sharing was cancelled or is unavailable in this browser.')}};function stop(){S.stream?.getTracks().forEach(t=>t.stop());S.stream=null;S.peers.forEach(p=>p.close());S.peers.clear();$('#screen').innerHTML='<div class="placeholder"><strong>Private room ready</strong><span>Share your screen or load a browser-playable video.</span></div>';$('#share').disabled=false;$('#stop').disabled=true;$('#state').textContent='No screen shared';send({type:'screen-stopped'})}$('#stop').onclick=stop;$('#full').onclick=()=>$('#screen').requestFullscreen?.();$('#invite').onclick=async()=>{let u=location.origin+'/?room='+S.room;try{await navigator.clipboard.writeText(u);add('WatchBot','Invite link copied.')}catch{prompt('Copy invite link',u)}};$('#mic').onclick=async()=>{if(S.mic){S.mic.getTracks().forEach(t=>t.stop());S.mic=null;$('#mic').innerHTML='<svg class="icon"><use href="#micIcon"/></svg>Mic off';return}try{S.mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});$('#mic').innerHTML='<svg class="icon"><use href="#micIcon"/></svg>Mic on'}catch{add('WatchBot','Microphone permission was denied.')}};$('#leave').onclick=()=>{stop();S.ws?.close();location.href=location.pathname};$('#form').onsubmit=e=>{e.preventDefault();let t=$('#text').value.trim();if(t){add(S.name,t);send({type:'chat',text:t});$('#text').value=''}};$('#chatToggle').onclick=()=>$('#chat').classList.toggle('hide');$('#join').onclick=()=>{S.name=$('#name').value.trim()||'Guest';S.room=($('#room').value.trim()||Math.random().toString(36).slice(2,8)).toLowerCase().replace(/[^a-z0-9-]/g,'');history.replaceState(null,'','?room='+S.room);$('#modal').classList.add('hide');connect()};$('#room').value=p.get('room')||Math.random().toString(36).slice(2,8)})();</script></body></html>
